<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energieplanung — Prototyp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <span class="logo-kanton">KANTON<span class="test-badge">Test</span></span>
      <span class="logo-luzern">LUZERN</span>
    </div>
    <div class="logo-sep"></div>
    <div class="app-title">Energieplanung</div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" title="Bereich wählen" data-toast="Nicht Teil dieses Prototyps">
      <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v5h-8V3zM3 13h5v8H3v-8zm7 2h11v6H10v-6z"/></svg>
    </button>
    <button class="icon-btn" title="Anwendungen" data-toast="Nicht Teil dieses Prototyps">
      <svg viewBox="0 0 24 24"><path d="M4 4h5v5H4V4zm7 0h5v5h-5V4zm7 0h5v5h-5V4zM4 11h5v5H4v-5zm7 0h5v5h-5v-5zm7 0h5v5h-5v-5zM4 18h5v5H4v-5zm7 0h5v5h-5v-5zm7 0h5v5h-5v-5z"/></svg>
    </button>
    <button class="icon-btn" title="Exportieren" data-toast="Nicht Teil dieses Prototyps">
      <svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-9 9-1.4-1.4 9-9H14V3zM5 5h6v2H5v12h12v-6h2v8H3V5h2z"/></svg>
    </button>
    <div class="topbar-search">
      <input type="text" placeholder="Adresse, Ort, Grundstücknummer, ...">
      <button class="search-btn" data-toast="Nicht Teil dieses Prototyps">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ============ MAIN LAYOUT ============ -->
<div class="app-body">

  <!-- ---------- LEFT: MAP SIDEBAR (static) ---------- -->
  <aside class="map-sidebar">
    <div class="sidebar-panel">
      <div class="sidebar-panel-header">
        <span class="chevron">−</span>
        <span>Karteninhalt</span>
      </div>
      <ul class="layer-tree">
        <li class="layer-node">
          <label class="layer-row bold">
            <span class="tree-toggle">−</span>
            <input type="checkbox" checked>
            <span>Neue Energieplanung</span>
          </label>
          <ul class="layer-subtree">
            <li><label class="layer-row"><input type="checkbox" checked><span>Massnahmen (Punkte)</span></label></li>
            <li><label class="layer-row"><input type="checkbox" checked><span>Massnahmen (Linien)</span></label></li>
            <li><label class="layer-row"><input type="checkbox" checked><span>Massnahmen (Flächen)</span></label></li>
          </ul>
        </li>
        <li><label class="layer-row"><span class="tree-toggle">+</span><input type="checkbox"><span>EPA-Karte</span></label></li>
        <li><label class="layer-row"><span class="tree-toggle">+</span><input type="checkbox"><span>EPA-Indikatoren</span></label></li>
        <li><label class="layer-row"><span class="tree-toggle">+</span><input type="checkbox"><span>Gültige räumliche Energieplanungen</span></label></li>
      </ul>
      <div class="sidebar-tool-row"><span class="tree-toggle">+</span><span class="tool-icon">▤</span><span>Legende</span></div>
      <div class="sidebar-tool-row"><span class="tree-toggle">+</span><span class="tool-icon">🖶</span><span>Drucken</span></div>
      <div class="sidebar-tool-row"><span class="tree-toggle">+</span><span class="tool-icon">⇄</span><span>Teilen &amp; Tools</span></div>
    </div>
    <button class="sidebar-close-tab">⌂ schliessen</button>
  </aside>

  <!-- ---------- CENTER: STATIC MAP ---------- -->
  <main class="map-area">
    <div class="map-static">
      <div class="map-water"></div>
      <div class="map-label" style="top:14%; left:60%;">Ebikon</div>
      <div class="map-label" style="top:32%; left:12%;">Emmen</div>
      <div class="map-label" style="top:56%; left:34%;">Luzern</div>
      <div class="map-label" style="top:72%; left:20%;">Kriens</div>
      <div class="map-label small" style="top:66%; left:56%;">Luzernersee</div>
      <div class="map-label small" style="top:86%; left:44%;">Horw</div>
    </div>
    <div class="map-scale">
      <div class="scale-bar"></div>
      <span>1'000 m</span>
    </div>
    <div class="map-minimap"></div>
    <div class="map-footer">© 2026 Kanton Luzern · Rechtliches · Problem melden</div>
  </main>

  <!-- ---------- RIGHT: FUNCTIONAL PANEL ---------- -->
  <section class="side-panel">
    <nav class="panel-tabs">
      <button class="panel-tab active" data-tab="planungen">
        <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM8 12h8v1.6H8V12zm0 3.4h8V17H8v-1.6zM8 8.6h4v1.6H8V8.6z"/></svg>
        <span>Aktuelle Planungen</span>
      </button>
      <button class="panel-tab" data-tab="kontakte">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>
        <span>Kontakte</span>
      </button>
      <button class="panel-tab" data-tab="zugriff">
        <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3zm0 2.2 6 2.2v4.6c0 3.9-2.6 6.9-6 8.8-3.4-1.9-6-4.9-6-8.8V6.4l6-2.2z"/></svg>
        <span>Zugriffsverwaltung</span>
      </button>
    </nav>

    <div id="panel-content" class="panel-content">
      <!-- rendered by app.js -->
    </div>
  </section>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
